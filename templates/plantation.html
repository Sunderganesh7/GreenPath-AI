<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🌱 Plantation Recommendation</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f1f8e9;
            padding: 40px;
            color: #1b5e20;
        }

        .card {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .zone {
            font-size: 20px;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .msg {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
            margin-top: 15px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
            color: white;
            background: #2e7d32;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
        }

        a:hover {
            background: #1b5e20;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>🌱 Plantation Recommendation</h2>

    {% if result %}
        <div class="zone">
            Recommended Zone: {{ result.vertical }} – {{ result.horizontal }}
        </div>

        <div class="msg">
            {{ result.message }}
        </div>
    {% else %}
        <div class="msg">
            Plantation recommendation is not available.<br>
            Please run tree distribution analysis first.
        </div>
    {% endif %}

    <a href="/">⬅ Back to Dashboard</a>
</div>

</body>
</html>
