<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carbon Absorption Estimation</title>
</head>

<body style="
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4fff6;
">

<div style="
    max-width: 700px;
    margin: 60px auto;
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
">

    <h1 style="
        color: #1b5e20;
        margin-bottom: 20px;
    ">
        🌿 Carbon Absorption Estimation
    </h1>

    <div style="
        background: linear-gradient(135deg, #e8f5e9, #ffffff);
        border-left: 6px solid #2e7d32;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    ">

        <div style="
            font-size: 18px;
            color: #1b5e20;
            font-weight: 600;
            margin-bottom: 15px;
        ">
            Estimated Annual CO₂ Absorption
        </div>

        <div style="
            font-size: 36px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 15px;
        ">
            {{ co2_absorption }} kg CO₂ / year
        </div>

        <div style="
            font-size: 15px;
            color: #555;
        ">
            Calculated using an average absorption rate of 
            <strong>22 kg CO₂ per mature tree per year</strong>.
        </div>

    </div>

    <div style="margin-top: 30px;">
        <a href="/" style="
            text-decoration: none;
            background: #2e7d32;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 15px;
        ">
            ⬅ Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
